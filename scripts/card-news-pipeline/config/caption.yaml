# Claude 문구 파이프라인(옵트인) 설정.
# auto_daily.py --claude-caption 또는 caption_review.py 가 읽는다. 기본 일일 자동화는 이 파일을 쓰지 않는다.
#
# 모델 우선순위: 환경변수 CARD_NEWS_CAPTION_MODEL > 이 파일 model > 코드 기본값(claude-sonnet-5-5)
# 요금(2026-09 기준, claude-api 스킬 표): claude-sonnet-5-5 입력 $2 / 출력 $10 per 1M tokens

model: claude-sonnet-5-5

# output_config.effort (low | medium | high | xhigh | max). 생성·판정은 짧은 구조화 출력이라 medium 으로 시작.
effort: medium

# 호출 1회당 최대 출력 토큰
max_tokens: 4000

# 호출 1회 타임아웃(초). CLI 경로는 프로세스를 이 시간 뒤 종료한다.
timeout_seconds: 180

# CLI 경로에서 호출 1회당 지출 상한(USD). claude -p --max-budget-usd 로 전달.
cli_max_budget_usd: 0.5

# API 경로: 거절(refusal) 시 서버 측 폴백(fallbacks: "default") 사용 여부
api_refusal_fallback: true

# 원문 확보
fetch:
  timeout_seconds: 20
  max_bytes: 3000000
  # 모델 입력에 넣을 원문 최대 길이(자). 넘으면 잘라서 넣고 결과에 source_truncated=true 로 기록한다.
  max_source_chars: 30000
  # 이 길이보다 짧게 추출되면 본문 확보 실패로 보고 RSS 요약으로 폴백(confidence: low)
  min_body_chars: 400
  user_agent: "Mozilla/5.0 (compatible; gotech-card-news/1.0)"

# 판정(호출 2)을 코드 검사가 실패해도 실행할지. 사람이 볼 판정표를 남기려면 true.
judge_even_if_checks_fail: true

# 추가로 Claude 입력에서 뺄 도메인(Reddit 계열은 코드에서 항상 제외하므로 여기 적지 않아도 된다)
extra_blocked_domains: []

# 길이 규칙(프론트 카드 템플릿과 공유)
limits:
  title_max: 30
  hook_lines_max: 2
  hook_line_max: 16
  fact_count: 3
  fact_max: 60
  why_lines_min: 2
  why_lines_max: 3
  why_line_max: 60
  numbers_max: 3
  number_value_max: 16
  number_label_max: 24
  tag_count: 3
  tag_max: 16
  source_name_max: 40
  overlap_chars: 25
