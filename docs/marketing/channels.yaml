# 배포 채널 레지스트리 — 단일 원천 (HANDOFF §10.1)
# 채널을 늘리거나 줄일 때는 이 파일만 PR 로 고친다. 루틴(R4)은 status: active 인 채널만 초안을 만든다.
# 새 형식이 필요하면 formats/<format>.md 를 같은 PR 에 추가한다. 루틴 프롬프트는 바꾸지 않는다.
# 게시는 언제나 사람이 직접 한다(manual_only). 자동 게시 API 가 있어도 쓰지 않는다.
# 근거: docs/marketing/channel-research.md (2026-11-04 조사). [확인 필요] 항목은 게시 전 직접 확인.

version: 1
canonical: blog            # 원본은 항상 우리 사이트(POSSE: 자기 사이트에 먼저 게시, 다른 곳엔 링크로)
budget:
  daily_minutes: 15        # 경석님 하루 게시 시간 상한 — active 채널 합계 주당 분 ≤ 75 를 지킨다
  max_active: 5

channels:
  - id: blog
    name: GoTechy 블로그
    kind: owned
    status: active
    formats: [release-post]
    weekly_minutes: 10     # 목요일 content PR 리뷰·머지
    link: canonical

  - id: x
    name: X
    kind: social
    lang: ko
    status: active
    formats: [short-post]
    weekly_minutes: 5
    utm_source: x
    rules_url: https://help.x.com/en/rules-and-policies/platform-manipulation   # [확인 필요] 2026-11-04 열람 실패
    manual_only: true

  - id: threads
    name: Threads
    kind: social
    lang: ko
    status: active
    formats: [thread-series]
    weekly_minutes: 5
    limits: { text_chars: 500 }   # Threads API 개요 문서
    utm_source: threads
    manual_only: true

  - id: geeknews
    name: GeekNews Show GN
    kind: community
    lang: ko
    status: active
    formats: [community-showcase]
    weekly_minutes: 10
    rules_url: https://news.hada.io/guidelines
    rules: "Show GN 으로만, 직접 써 볼 수 있는 도구 URL 원본(블로그 글·YouTube·단축 URL 금지), 이미지 없이 마크다운"
    link: tool              # 블로그 글이 아니라 /tools/<slug> 를 올린다
    manual_only: true

  - id: linkedin
    name: LinkedIn
    kind: social
    lang: ko
    status: active
    formats: [retro-post]
    weekly_minutes: 5
    rules_url: https://www.linkedin.com/legal/professional-community-policies
    utm_source: linkedin
    manual_only: true

  # ---- planned: 켜려면 status 를 active 로 바꾸고, budget 합계를 다시 계산한다 ----
  - id: disquiet
    name: 디스콰이엇
    kind: community
    lang: ko
    status: planned        # 공식 운영정책 미확인 [확인 필요] → 확인되면 수요일 2순위
    formats: [maker-log]
    weekly_minutes: 10
    link: blog

  - id: instagram
    name: Instagram
    kind: social
    lang: ko
    status: planned        # 카드뉴스형 도구(card-news-canvas) 출시 때 검토
    formats: [carousel]
    weekly_minutes: 10
    limits: { carousel_max: 20 }   # Content Publishing 문서. 4:5 지원 여부 [확인 필요]

  - id: youtube-shorts
    name: YouTube Shorts
    kind: video
    lang: ko
    status: planned        # 영상 렌더는 로컬 세션 전용(hyperframes 등) — 클라우드 루틴은 대본·스토리보드까지만
    formats: [shorts-script]
    weekly_minutes: 30
    limits: { max_seconds: 180, orientation: vertical }   # YouTube 도움말 10059070

  - id: show-hn
    name: Hacker News Show HN
    kind: community
    lang: en
    status: planned        # 영어 UI 도구가 생기면. 블로그 글·가입 필요 페이지 금지
    formats: [community-showcase]
    weekly_minutes: 10
    rules_url: https://news.ycombinator.com/showhn.html
    link: tool
